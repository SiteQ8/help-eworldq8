<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eWorld Help :: computer, laptop and website help in Kuwait</title>
<meta name="description" content="Everyday computing help. We build and check websites, fix laptops and desktops, recover files and set things up. Tell us what is happening and we will tell you what it usually is.">
<link rel="canonical" href="https://siteq8.github.io/help-eworldq8/">
<meta name="theme-color" content="#0f4c81">
<meta property="og:type" content="website">
<meta property="og:url" content="https://siteq8.github.io/help-eworldq8/">
<meta property="og:title" content="eWorld Help">
<meta property="og:description" content="Computer, laptop and website help. Tell us what is happening and we will tell you what it usually is.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>

<body>
<a class="skip" href="#main">Skip to content</a>

<header class="top">
  <div class="shell top-in">
    <a class="brand" href="./"><b>eWorld</b> <span data-t="brandHelp">Help</span></a>
    <div class="top-right">
      <button class="lang" id="lang" type="button" lang="ar">العربية</button>
      <a class="cta" href="#ask" data-t="getHelp">Get help</a>
    </div>
  </div>
</header>

<main id="main">

  <section class="hero">
    <div class="shell">
      <h1 data-t="heroH">Something broken? Start here.</h1>
      <p class="lede" data-t="heroP"></p>
      <a class="btn btn-lg" href="#ask" data-t="heroBtn"></a>
      <p class="fine" data-t="heroFine"></p>
    </div>
  </section>

  <!-- ================= triage ================= -->
  <section class="ask" id="ask">
    <div class="shell">
      <p class="kicker" data-t="askKicker"></p>
      <h2 data-t="askH"></h2>

      <div class="q" id="q1">
        <p class="q-label" data-t="q1"></p>
        <div class="opts" id="devices"></div>
      </div>

      <div class="q" id="q2" hidden>
        <p class="q-label" data-t="q2"></p>
        <div class="opts" id="symptoms"></div>
        <button class="back" id="back" type="button" data-t="back"></button>
      </div>

      <div class="result" id="result" hidden></div>
    </div>
  </section>

  <!-- ================= services ================= -->
  <section class="block" id="services">
    <div class="shell">
      <p class="kicker" data-t="svcKicker"></p>
      <h2 data-t="svcH"></h2>
      <ul class="svcs" id="svcs"></ul>
    </div>
  </section>

  <!-- ================= how ================= -->
  <section class="block alt" id="how">
    <div class="shell">
      <p class="kicker" data-t="howKicker"></p>
      <h2 data-t="howH"></h2>
      <ol class="steps">
        <li data-t="step1"></li>
        <li data-t="step2"></li>
        <li data-t="step3"></li>
      </ol>
    </div>
  </section>

  <!-- ================= contact ================= -->
  <section class="block" id="contact">
    <div class="shell">
      <p class="kicker" data-t="contactKicker"></p>
      <h2 data-t="contactH"></h2>
      <div class="contact" id="contact-list"></div>
      <p class="fine" id="contact-note"></p>
    </div>
  </section>

</main>

<footer class="foot">
  <div class="shell foot-in">
    <p><b>eWorld</b> Help</p>
    <p data-t="footPlace"></p>
  </div>
</footer>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
